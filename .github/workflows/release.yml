name: release

on:
  push:
    tags:
      - 'v*'      # conventional v0.4.0
      - '*.*.*'   # and plain 0.4.0 (matches build/config.yml verbatim)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails in seconds if the tag and the packaged version disagree, before
  # three OS builds burn ten minutes.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="$(sed -n 's/^[[:space:]]*version: "\([^"]*\)"/\1/p' build/config.yml)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Accept both v0.4.0 and 0.4.0 tags; anything else is a mismatch.
          # REF_* come from env (not inline interpolation) so a crafted tag
          # name can't inject shell.
          if [[ "$REF_TYPE" == "tag" && "v$V" != "$REF_NAME" && "$V" != "$REF_NAME" ]]; then
            echo "::error::build/config.yml version $V does not match tag $REF_NAME. Re-tag or bump the version."
            exit 1
          fi

  windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      # The choco nsis package (a silent NSIS installer run) installs makensis
      # to C:\Program Files (x86)\NSIS but never adds it to PATH — the runner
      # needs it explicitly for `wails3 task windows:package`.
      - name: Add NSIS to PATH
        shell: bash
        run: echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
      - name: Package (exe + NSIS installer)
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task windows:package
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bin/*.exe
          if-no-files-found: error

  macos:
    needs: preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2
      - name: Package (.app bundle + dmg)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task darwin:package:dmg
      # The self-updater's darwin artifact is a zip of the .app bundle (it
      # replaces the bundle in place).
      - name: Zip .app for the updater
        run: |
          APP=$(find bin -maxdepth 3 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "no .app bundle found in bin/"; exit 1
          fi
          cd "$(dirname "$APP")"
          zip -rq "$GITHUB_WORKSPACE/bin/owldrop-darwin-amd64.zip" "$(basename "$APP")"
          ls -la "$GITHUB_WORKSPACE/bin/owldrop-darwin-amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            bin/*.dmg
            bin/*.zip
          if-no-files-found: error

  # Linux needs GTK4 + WebKitGTK 6.0 headers AND the WebKit helper binaries
  # at /usr for the AppImage — neither is on ubuntu-latest (24.04 ships
  # WebKit 4.1, and the wails3 CLI itself needs the GTK dev headers to
  # compile on Linux), so the whole build+package runs inside the wails-cross
  # image. The host only needs docker: setup:docker is a plain `docker build`
  # (see build/Taskfile.yml).
  linux:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wails-cross image
        # Docker Hub registry timeouts are flaky on runners; retry a few times.
        run: |
          for i in 1 2 3; do
            if docker build -t wails-cross -f build/docker/Dockerfile.cross build/docker/; then
              exit 0
            fi
            echo "docker build attempt $i failed — retrying in 20s"
            sleep 20
          done
          exit 1
      - name: Build and package inside wails-cross
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD":/app -w /app \
            wails-cross -c '
              set -e
              export PATH="$PATH:$(go env GOPATH)/bin"
              go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2
              wails3 task linux:package
            '
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            bin/*.deb
            bin/*.rpm
          if-no-files-found: error
      # The install-repo binary must be NIX-built: its RPATHs point into the
      # nix store, so it runs inside the FHS wrapper on NixOS. A
      # container-built (Debian) binary needs libX11 + the X stack, which the
      # wrapper doesn't provide.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4
      - name: Build nix binary for the install repo
        run: |
          # No magic-nix-cache: its local substituter proxy has flaked on
          # GitHub's cache service (HTTP 418). cache.nixos.org serves the
          # whole closure directly and is reliable.
          # The nix binary goes to /tmp, NOT bin/: the docker steps above
          # leave bin/ root-owned on the runner.
          nix build .#sidecar -o /tmp/sidecar
          cp /tmp/sidecar/bin/owldrop /tmp/owldrop-nix
      - uses: actions/upload-artifact@v4
        with:
          name: linux-nix
          path: /tmp/owldrop-nix
          if-no-files-found: error

  # NOTE: no AppImage in the release. WebKitGTK hardcodes its helper-process
  # path (/usr/lib/x86_64-linux-gnu/webkitgtk-6.0) at compile time and does
  # not honor WEBKIT_EXEC_PATH, so a bundled-WebKit AppImage cannot spawn its
  # own helpers (verified with the v0.4.0 build). The deb/rpm depend on the
  # system WebKit and are the supported Linux artifacts; on NixOS use the
  # flake package (install.sh).

  # Boots the Windows and macOS builds on GitHub's own runners and asserts
  # the localhost UI answers — real-binary smoke coverage on platforms the
  # maintainer doesn't own. (Linux is testable locally; the UI itself is the
  # same web app on all platforms and is browser-tested.) The HTTP server
  # binds before the window is created, so even a headless-window failure
  # still proves the binary runs.
  smoke:
    needs: [windows, macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'windows' || 'macos' }}
          path: build
      - name: Smoke — Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Filter *.exe | Where-Object { $_.Name -notmatch 'installer' } | Select-Object -First 1
          if (-not $exe) { throw 'no app exe found' }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8976/' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'app did not answer on http://127.0.0.1:8976/' }
            Write-Host "smoke OK: HTTP $($r.StatusCode)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Smoke — macOS
        if: matrix.os == 'macos-14'
        run: |
          set -e
          hdiutil attach build/*.dmg -nobrowse -quiet
          trap 'hdiutil detach /Volumes/* -quiet || true' EXIT
          APP=$(find /Volumes -maxdepth 2 -name '*.app' | head -1)
          BIN=$(find "$APP" -path '*/MacOS/*' -type f | head -1)
          echo "launching $BIN"
          "$BIN" > /tmp/owd-smoke.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf -o /dev/null http://127.0.0.1:8976/; then
              echo "smoke OK"
              OK=1
              break
            fi
          done
          kill $PID 2>/dev/null || true
          if [ "$OK" -ne 1 ]; then
            echo 'FAILED — app log:'; cat /tmp/owd-smoke.log || true
            exit 1
          fi

  # Builds and pushes the headless NAS/Docker image to ghcr (root Dockerfile:
  # static -tags server binary on alpine). Independent of the OS builds — the
  # container compiles its own binary and frontend from source.
  docker:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve lowercase image name (ghcr rejects uppercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # Stop buildx uploading a .dockerbuild artifact into the run: the
          # catch-all artifact downloads in release/publish-updates fail on it.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: VERSION=${{ needs.preflight.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ needs.preflight.outputs.version }}

  # Publishes to the public owldrop-install repo (source stays private):
  # the nix-built linux binary (for `nix profile install`), the .deb/.rpm
  # packages (for the website's Linux download section), plus the Wails
  # update manifest and per-platform update artifacts (Windows exe, macOS
  # .app zip) consumed by the app's built-in self-updater.
  # The INSTALL_REPO_SSH_KEY secret is a private key whose public half is a
  # write-enabled deploy key on Rastavich/owldrop-install (one repo only).
  publish-updates:
    # preflight is required: its `version` output names the release.
    needs: [preflight, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux,linux-nix,windows,macos}"
          path: dl
      - name: Build update manifest and stage files
        run: |
          set -e
          V="${{ needs.preflight.outputs.version }}"
          EXE=$(ls dl/windows/*.exe | grep -v installer | head -1)
          ZIP=$(ls dl/macos/*.zip | head -1)
          NIX=dl/linux-nix/owldrop-nix
          DEB=$(ls dl/linux/*.deb | head -1)
          RPM=$(ls dl/linux/*.rpm | head -1)
          [ -n "$EXE" ] && [ -n "$ZIP" ] && [ -f "$NIX" ] && [ -n "$DEB" ] && [ -n "$RPM" ] || { echo "missing artifacts"; exit 1; }
          exe_digest=$(sha256sum "$EXE" | cut -d' ' -f1 | xxd -r -p | base64)
          zip_digest=$(sha256sum "$ZIP" | cut -d' ' -f1 | xxd -r -p | base64)
          mkdir -p stage/updates
          cp "$EXE" stage/updates/owldrop-windows-amd64.exe
          cp "$ZIP" stage/updates/owldrop-darwin-amd64.zip
          # .deb/.rpm are published as static mirrors for the website's
          # download section (not in stable.json — the in-app updater is
          # Windows/macOS only).
          cp "$DEB" stage/updates/owldrop-linux-amd64.deb
          cp "$RPM" stage/updates/owldrop-linux-x86_64.rpm
          cp "$NIX" stage/owldrop
          chmod +x stage/owldrop
          cat > stage/updates/stable.json <<EOF
          {"schemaVersion":1,"version":"$V","channel":"stable","name":"Owldrop $V","publishedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","artifacts":[
          {"url":"https://raw.githubusercontent.com/Rastavich/owldrop-install/main/updates/owldrop-windows-amd64.exe","filename":"owldrop-windows-amd64.exe","filetype":"exe","platform":"windows","arch":"amd64","size":$(stat -c%s "$EXE"),"digestAlgo":"sha256","digest":"$exe_digest"},
          {"url":"https://raw.githubusercontent.com/Rastavich/owldrop-install/main/updates/owldrop-darwin-amd64.zip","filename":"owldrop-darwin-amd64.zip","filetype":"zip","platform":"darwin","arch":"amd64","size":$(stat -c%s "$ZIP"),"digestAlgo":"sha256","digest":"$zip_digest"}
          ]}
          EOF
          jq . stage/updates/stable.json > /dev/null
          echo "manifest OK: $(jq -r .version stage/updates/stable.json)"
      - name: Push to public install repo
        env:
          INSTALL_REPO_SSH_KEY: ${{ secrets.INSTALL_REPO_SSH_KEY }}
        run: |
          if [ -z "$INSTALL_REPO_SSH_KEY" ]; then
            echo "::warning::INSTALL_REPO_SSH_KEY not set — skipping publish to owldrop-install"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$INSTALL_REPO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519"
          rm -rf /tmp/owldrop-install
          git clone git@github.com:Rastavich/owldrop-install.git /tmp/owldrop-install
          cd /tmp/owldrop-install
          rm -rf updates tailscale-drop owldrop
          cp -r "$GITHUB_WORKSPACE/stage/." .
          git config user.name "release-bot"
          git config user.email "release@owldrop.local"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — nothing to publish"
          else
            git commit -m "release ${{ needs.preflight.outputs.version }}"
            git push origin main
          fi

  release:
    needs: [preflight, windows, macos, linux]
    # Tag pushes publish the tagged release; manual runs publish (or update)
    # the release named after the packaged version, so a dispatch run's
    # artifacts are downloadable too.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh (below) needs the git repo to resolve owner/name — the job would
      # otherwise have no checkout at all.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux,linux-nix,windows,macos}"
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag runs (v0.4.0 or 0.4.0) publish under the actual tag name;
          # branch dispatch publishes under v<version>.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ needs.preflight.outputs.version }}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Owldrop $TAG" --generate-notes
          fi
          # Defensive: a draft release is invisible to users — never ship one.
          gh release edit "$TAG" --draft=false
