name: release

on:
  push:
    tags:
      - 'v*'      # conventional v0.4.0
      - '*.*.*'   # and plain 0.4.0 (matches build/config.yml verbatim)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails in seconds if the tag and the packaged version disagree, before
  # three OS builds burn ten minutes.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="$(sed -n 's/^[[:space:]]*version: "\([^"]*\)"/\1/p' build/config.yml)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Accept both v0.4.0 and 0.4.0 tags; anything else is a mismatch.
          # REF_* come from env (not inline interpolation) so a crafted tag
          # name can't inject shell.
          if [[ "$REF_TYPE" == "tag" && "v$V" != "$REF_NAME" && "$V" != "$REF_NAME" ]]; then
            echo "::error::build/config.yml version $V does not match tag $REF_NAME. Re-tag or bump the version."
            exit 1
          fi

  # High/critical npm advisories (web + site) and reachable Go/Wails vulns.
  # Runs before the expensive OS package jobs.
  vuln:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - name: Vulnerability check (high/critical)
        run: ./scripts/vulncheck.sh


  windows:
    needs: [preflight, vuln]
    runs-on: windows-latest
    # The `release` environment scopes the Azure federated credential
    # (repo:<owner>/<repo>:environment:release) — federated credentials
    # can't wildcard tag refs, so an environment is the stable OIDC subject.
    # The AZURE_* secrets / TRUSTED_SIGNING_* vars can live on the
    # environment instead of the repo.
    environment: release
    # id-token: write is needed for the Azure OIDC login used by Artifact
    # (Trusted) Signing. Job-level permissions replace the workflow-level
    # `contents: read`, so it must be restated here.
    permissions:
      contents: read
      id-token: write
    env:
      # Signing configuration. Precedence: Azure Artifact Signing (all four
      # TRUSTED_SIGNING_* vars + the three AZURE_* secrets set) > PFX secrets
      # > unsigned (with a warning).
      SIGN_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
      SIGN_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
      SIGN_REGION: ${{ vars.TRUSTED_SIGNING_REGION }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.5
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      # The choco nsis package (a silent NSIS installer run) installs makensis
      # to C:\Program Files (x86)\NSIS but never adds it to PATH — the runner
      # needs it explicitly for `wails3 task windows:package`.
      - name: Add NSIS to PATH
        shell: bash
        run: echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
      - name: Package (exe + NSIS installer)
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task windows:package
      # Code signing is the only fix for Defender heuristic flags (Wacatac.B!ml)
      # and Smart App Control blocks. Preferred path: Azure Artifact (Trusted)
      # Signing — Microsoft-trust-rooted certs, immediate SmartScreen/Defender
      # reputation. Runs when all TRUSTED_SIGNING_* vars and AZURE_* secrets
      # are set; otherwise the PFX step below handles signing (or warns that
      # the build ships unsigned).
      - name: Azure login (OIDC — Artifact Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' && env.SIGN_ACCOUNT != '' && env.SIGN_PROFILE != '' && env.SIGN_REGION != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign binaries (Azure Artifact Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' && env.SIGN_ACCOUNT != '' && env.SIGN_PROFILE != '' && env.SIGN_REGION != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://${{ vars.TRUSTED_SIGNING_REGION }}.codesigning.azure.net/
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          # Signs both bin\owldrop.exe and bin\owldrop-*-installer.exe.
          files-folder: ${{ github.workspace }}\bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # PFX fallback: an OV/EV Authenticode certificate from a CA (DigiCert,
      # Sectigo, SSL.com, Certum). Runs only when Azure Artifact Signing isn't
      # configured. Without any signing config it warns and ships unsigned
      # (current behavior) so a release isn't blocked.
      - name: Sign binaries (Authenticode PFX fallback)
        if: ${{ !(env.AZURE_CLIENT_ID != '' && env.SIGN_ACCOUNT != '' && env.SIGN_PROFILE != '' && env.SIGN_REGION != '') }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64)) {
            Write-Host "::warning::WINDOWS_SIGNING_PFX secret is not set — shipping UNSIGNED. Windows Defender will flag the exe and Smart App Control will block it. Set WINDOWS_SIGNING_PFX (base64 of an Authenticode .pfx) + WINDOWS_SIGNING_PASSWORD and re-run the workflow to get signed artifacts."
            exit 0
          }
          if ([string]::IsNullOrEmpty($env:PFX_PASSWORD)) {
            throw 'WINDOWS_SIGNING_PFX is set but WINDOWS_SIGNING_PASSWORD is empty'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'owldrop-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          # signtool ships with the Windows SDK, which is always installed on
          # windows-latest (e.g. ...\Windows Kits\10\bin\10.0.26100.0\x64).
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found under Windows Kits — check the runner image' }
          Write-Host "signtool: $($signtool.FullName)"
          $targets = Get-ChildItem -Path 'bin\owldrop.exe', 'bin\*installer.exe' -ErrorAction SilentlyContinue
          if (-not $targets) { throw 'no binaries found to sign under bin/' }
          foreach ($t in $targets) {
            Write-Host "Signing: $($t.FullName)"
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD `
              /tr 'http://timestamp.digicert.com' /td SHA256 /v $t.FullName
            # signtool contract: 0 = success, 1 = failure, 2 = warnings (e.g.
            # a transient timestamp-server hiccup). Only a hard failure aborts.
            if ($LASTEXITCODE -eq 1) { throw "signtool sign failed for $($t.FullName)" }
            if ($LASTEXITCODE -eq 2) { Write-Host "::warning::signtool sign returned warnings for $($t.FullName)" }
          }
          foreach ($t in $targets) {
            & $signtool.FullName verify /pa /v $t.FullName
            if ($LASTEXITCODE -eq 1) { throw "signtool verify failed for $($t.FullName)" }
            if ($LASTEXITCODE -eq 2) { Write-Host "::warning::signtool verify returned warnings for $($t.FullName)" }
          }
          Remove-Item $pfx -Force
      # Store submission package: unsigned MSIX (Microsoft signs it during
      # certification). Packed by tools/msixpack via build/windows/msix/pack.sh.
      # Kept out of the windows artifact so the unsigned MSIX never lands on
      # the GitHub release — it's only for Partner Center upload.
      - name: Package MSIX (Store submission)
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task windows:package FORMAT=msix
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: bin/*.msix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bin/*.exe
          if-no-files-found: error

  macos:
    needs: [preflight, vuln]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.5
      - name: Package (.app bundle + universal dmg)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task darwin:package:dmg:universal
      # The self-updater's darwin artifact is a zip of the .app bundle (it
      # replaces the bundle in place). One zip serves amd64 and arm64.
      - name: Zip .app for the updater
        run: |
          APP=$(find bin -maxdepth 3 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "no .app bundle found in bin/"; exit 1
          fi
          cd "$(dirname "$APP")"
          zip -rq "$GITHUB_WORKSPACE/bin/owldrop-darwin-universal.zip" "$(basename "$APP")"
          # Keep the old filename so existing updater URLs and bookmarks work.
          cp "$GITHUB_WORKSPACE/bin/owldrop-darwin-universal.zip" "$GITHUB_WORKSPACE/bin/owldrop-darwin-amd64.zip"
          ls -la "$GITHUB_WORKSPACE/bin/"*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            bin/*.dmg
            bin/*.zip
          if-no-files-found: error

  # Linux needs GTK4 + WebKitGTK 6.0 headers AND the WebKit helper binaries
  # at /usr for the AppImage — neither is on ubuntu-latest (24.04 ships
  # WebKit 4.1, and the wails3 CLI itself needs the GTK dev headers to
  # compile on Linux), so the whole build+package runs inside the wails-cross
  # image. The host only needs docker: setup:docker is a plain `docker build`
  # (see build/Taskfile.yml).
  linux:
    needs: [preflight, vuln]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wails-cross image
        # Docker Hub registry timeouts are flaky on runners; retry a few times.
        run: |
          for i in 1 2 3; do
            if docker build -t wails-cross -f build/docker/Dockerfile.cross build/docker/; then
              exit 0
            fi
            echo "docker build attempt $i failed — retrying in 20s"
            sleep 20
          done
          exit 1
      - name: Build and package inside wails-cross
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD":/app -w /app \
            wails-cross -c '
              set -e
              export PATH="$PATH:$(go env GOPATH)/bin"
              go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.5
              wails3 task linux:package
            '
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            bin/*.deb
            bin/*.rpm
          if-no-files-found: error
      # The install-repo binary must be NIX-built: its RPATHs point into the
      # nix store, so it runs inside the FHS wrapper on NixOS. A
      # container-built (Debian) binary needs libX11 + the X stack, which the
      # wrapper doesn't provide.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4
      - name: Build nix binary for the install repo
        run: |
          # No magic-nix-cache: its local substituter proxy has flaked on
          # GitHub's cache service (HTTP 418). cache.nixos.org serves the
          # whole closure directly and is reliable.
          # The nix binary goes to /tmp, NOT bin/: the docker steps above
          # leave bin/ root-owned on the runner.
          nix build .#sidecar -o /tmp/sidecar
          cp /tmp/sidecar/bin/owldrop /tmp/owldrop-nix
      - uses: actions/upload-artifact@v4
        with:
          name: linux-nix
          path: /tmp/owldrop-nix
          if-no-files-found: error

  # Ubuntu 24.04 LTS (and Debian 12) ship WebKit2GTK 4.1, not WebKitGTK 6.0.
  # Build with -tags gtk3 on the 24.04 runner so the artifact actually launches.
  linux-gtk3:
    needs: [preflight, vuln]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install GTK3 + WebKit2GTK 4.1 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev rpm
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.5
      - name: Package gtk3 deb + rpm
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task linux:package:gtk3
          mkdir -p gtk3out
          DEB=$(ls bin/*.deb | head -1)
          RPM=$(ls bin/*.rpm | head -1)
          cp "$DEB" gtk3out/owldrop-linux-amd64-webkit41.deb
          cp "$RPM" gtk3out/owldrop-linux-x86_64-webkit41.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gtk3
          path: gtk3out/*
          if-no-files-found: error

  # NOTE: no AppImage in the release. WebKitGTK hardcodes its helper-process
  # path (/usr/lib/x86_64-linux-gnu/webkitgtk-6.0) at compile time and does
  # not honor WEBKIT_EXEC_PATH, so a bundled-WebKit AppImage cannot spawn its
  # own helpers (verified with the v0.4.0 build). The deb/rpm depend on the
  # system WebKit and are the supported Linux artifacts; on NixOS use the
  # flake package (install.sh).

  # Boots the Windows and macOS builds on GitHub's own runners and asserts
  # the localhost UI answers — real-binary smoke coverage on platforms the
  # maintainer doesn't own. (Linux is testable locally; the UI itself is the
  # same web app on all platforms and is browser-tested.) The HTTP server
  # binds before the window is created, so even a headless-window failure
  # still proves the binary runs.
  smoke:
    needs: [windows, macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'windows' || 'macos' }}
          path: build
      - name: Smoke — Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Filter *.exe | Where-Object { $_.Name -notmatch 'installer' } | Select-Object -First 1
          if (-not $exe) { throw 'no app exe found' }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8976/' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'app did not answer on http://127.0.0.1:8976/' }
            Write-Host "smoke OK: HTTP $($r.StatusCode)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Smoke — macOS
        if: matrix.os == 'macos-14'
        run: |
          set -e
          hdiutil attach build/*.dmg -nobrowse -quiet
          trap 'hdiutil detach /Volumes/* -quiet || true' EXIT
          APP=$(find /Volumes -maxdepth 2 -name '*.app' | head -1)
          BIN=$(find "$APP" -path '*/MacOS/*' -type f | head -1)
          echo "launching $BIN"
          "$BIN" > /tmp/owd-smoke.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf -o /dev/null http://127.0.0.1:8976/; then
              echo "smoke OK"
              OK=1
              break
            fi
          done
          kill $PID 2>/dev/null || true
          if [ "$OK" -ne 1 ]; then
            echo 'FAILED — app log:'; cat /tmp/owd-smoke.log || true
            exit 1
          fi

  # Builds and pushes the headless NAS/Docker image to ghcr (root Dockerfile:
  # static -tags server binary on alpine). Independent of the OS builds — the
  # container compiles its own binary and frontend from source.
  docker:
    needs: [preflight, vuln]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve lowercase image name (ghcr rejects uppercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # Stop buildx uploading a .dockerbuild artifact into the run: the
          # catch-all artifact downloads in release/publish-updates fail on it.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: VERSION=${{ needs.preflight.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ needs.preflight.outputs.version }}

  # Publishes to the public owldrop-install repo (source stays private):
  # the nix-built linux binary (for `nix profile install`), the .deb/.rpm
  # packages (for the website's Linux download section), plus the Wails
  # update manifest and per-platform update artifacts (Windows exe, macOS
  # .app zip) consumed by the app's built-in self-updater.
  # The INSTALL_REPO_SSH_KEY secret is a private key whose public half is a
  # write-enabled deploy key on Rastavich/owldrop-install (one repo only).
  publish-updates:
    # preflight is required: its `version` output names the release.
    needs: [preflight, windows, macos, linux, linux-gtk3]
    runs-on: ubuntu-latest
    steps:
      # The stage step reads CHANGELOG.md from the repo — the workspace is
      # otherwise empty in this job (download-artifact only fills dl/).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux,linux-nix,linux-gtk3,windows,macos}"
          path: dl
      - name: Build update manifest and stage files
        run: |
          set -e
          V="${{ needs.preflight.outputs.version }}"
          EXE=$(ls dl/windows/*.exe | grep -v installer | head -1)
          ZIP=$(ls dl/macos/owldrop-darwin-universal.zip)
          NIX=dl/linux-nix/owldrop-nix
          DEB=$(ls dl/linux/*.deb | head -1)
          RPM=$(ls dl/linux/*.rpm | head -1)
          GTK3_DEB=$(ls dl/linux-gtk3/*.deb | head -1)
          GTK3_RPM=$(ls dl/linux-gtk3/*.rpm | head -1)
          [ -n "$EXE" ] && [ -n "$ZIP" ] && [ -f "$NIX" ] && [ -n "$DEB" ] && [ -n "$RPM" ] && [ -n "$GTK3_DEB" ] && [ -n "$GTK3_RPM" ] || { echo "missing artifacts"; ls -R dl; exit 1; }
          exe_digest=$(sha256sum "$EXE" | cut -d' ' -f1 | xxd -r -p | base64)
          zip_digest=$(sha256sum "$ZIP" | cut -d' ' -f1 | xxd -r -p | base64)
          zip_size=$(stat -c%s "$ZIP")
          mkdir -p stage/updates
          cp "$EXE" stage/updates/owldrop-windows-amd64.exe
          cp "$ZIP" stage/updates/owldrop-darwin-universal.zip
          cp "$ZIP" stage/updates/owldrop-darwin-amd64.zip
          # .deb/.rpm are published as static mirrors for the website's
          # download section (not in stable.json — the in-app updater is
          # Windows/macOS only).
          cp "$DEB" stage/updates/owldrop-linux-amd64.deb
          cp "$RPM" stage/updates/owldrop-linux-x86_64.rpm
          cp "$GTK3_DEB" stage/updates/owldrop-linux-amd64-webkit41.deb
          cp "$GTK3_RPM" stage/updates/owldrop-linux-x86_64-webkit41.rpm
          cp "$NIX" stage/owldrop
          chmod +x stage/owldrop
          # The changelog is the single source of truth for the site's
          # /changelog page (rendered from raw.githubusercontent.com).
          # Optional: a missing changelog must never block a release.
          [ -f "$GITHUB_WORKSPACE/CHANGELOG.md" ] && cp "$GITHUB_WORKSPACE/CHANGELOG.md" stage/CHANGELOG.md || true
          cat > stage/updates/stable.json <<EOF
          {"schemaVersion":1,"version":"$V","channel":"stable","name":"Owldrop $V","publishedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","artifacts":[
          {"url":"https://raw.githubusercontent.com/Rastavich/owldrop-install/main/updates/owldrop-windows-amd64.exe","filename":"owldrop-windows-amd64.exe","filetype":"exe","platform":"windows","arch":"amd64","size":$(stat -c%s "$EXE"),"digestAlgo":"sha256","digest":"$exe_digest"},
          {"url":"https://raw.githubusercontent.com/Rastavich/owldrop-install/main/updates/owldrop-darwin-universal.zip","filename":"owldrop-darwin-universal.zip","filetype":"zip","platform":"darwin","arch":"amd64","size":$zip_size,"digestAlgo":"sha256","digest":"$zip_digest"},
          {"url":"https://raw.githubusercontent.com/Rastavich/owldrop-install/main/updates/owldrop-darwin-universal.zip","filename":"owldrop-darwin-universal.zip","filetype":"zip","platform":"darwin","arch":"arm64","size":$zip_size,"digestAlgo":"sha256","digest":"$zip_digest"}
          ]}
          EOF
          jq . stage/updates/stable.json > /dev/null
          echo "manifest OK: $(jq -r .version stage/updates/stable.json)"
      - name: Push to public install repo
        env:
          INSTALL_REPO_SSH_KEY: ${{ secrets.INSTALL_REPO_SSH_KEY }}
        run: |
          if [ -z "$INSTALL_REPO_SSH_KEY" ]; then
            echo "::warning::INSTALL_REPO_SSH_KEY not set — skipping publish to owldrop-install"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$INSTALL_REPO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519"
          rm -rf /tmp/owldrop-install
          git clone git@github.com:Rastavich/owldrop-install.git /tmp/owldrop-install
          cd /tmp/owldrop-install
          rm -rf updates tailscale-drop owldrop
          cp -r "$GITHUB_WORKSPACE/stage/." .
          git config user.name "release-bot"
          git config user.email "release@owldrop.local"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — nothing to publish"
          else
            git commit -m "release ${{ needs.preflight.outputs.version }}"
            git push origin main
          fi

  release:
    needs: [preflight, windows, macos, linux, linux-gtk3]
    # Tag pushes publish the tagged release; manual runs publish (or update)
    # the release named after the packaged version, so a dispatch run's
    # artifacts are downloadable too.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh (below) needs the git repo to resolve owner/name — the job would
      # otherwise have no checkout at all.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux,linux-nix,linux-gtk3,windows,macos}"
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag runs (v0.4.0 or 0.4.0) publish under the actual tag name;
          # branch dispatch publishes under v<version>.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ needs.preflight.outputs.version }}"
          fi
          # This version's section of CHANGELOG.md is the release notes (single
          # source of truth); fall back to auto-generated notes only if the
          # section is missing, so a release never blocks.
          V="${{ needs.preflight.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$V" '
              /^## / { if (p) exit; if (index($0, "[" v "]")) p = 1 }
              p { print }
            ' CHANGELOG.md > /tmp/notes.md
            [ -s /tmp/notes.md ] && printf '\n**Full changelog:** https://owldrop.app/changelog\n' >> /tmp/notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            [ -s /tmp/notes.md ] && gh release edit "$TAG" --notes-file /tmp/notes.md
          elif [ -s /tmp/notes.md ]; then
            gh release create "$TAG" dist/* --title "Owldrop $TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" dist/* --title "Owldrop $TAG" --generate-notes
          fi
          # Defensive: a draft release is invisible to users — never ship one.
          gh release edit "$TAG" --draft=false
