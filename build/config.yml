# Build asset configuration. When you update `info`, run
# `wails3 task common:update:build-assets` to regenerate the platform assets
# (Info.plist, info.json, …). That overwrites any manual changes to them.
version: '3'

info:
  companyName: "Owldrop"
  productName: "Owldrop"
  productIdentifier: "app.owldrop"
  description: "Owldrop — desktop app for Tailscale file sharing"
  copyright: "(c) 2026, Owldrop"
  comments: "See files sent to you via Tailscale's Taildrop, save or delete them with one click, and send files back."
  version: "0.12.0"

# owldrop:// links ("Open in Owldrop" on owldrop.app/r) hand a tailcat share
# to the app (tailcat_recv.go handleOpenURLs). Mirrored by hand into
# darwin/Info*.plist, windows/nsis/wails_tools.nsh, windows/msix and
# linux/owldrop-url.desktop; update:build-assets regenerates the first two.
protocols:
  - scheme: owldrop
    description: Owldrop share link

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - bin
      - build
      - web
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task run
      type: primary
