# GTK3 + WebKit2GTK 4.1 stack (Ubuntu 24.04 LTS / Debian 12).
# Built with -tags gtk3. See nfpm.yaml for the default GTK4 + WebKitGTK 6.0
# packages (Ubuntu 24.10+ / Debian 13+).

name: "owldrop"
arch: ${GOARCH}
platform: "linux"
version: "0.7.3"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Owldrop — desktop app for Tailscale file sharing (WebKit2GTK 4.1)"
vendor: "Owldrop"
homepage: "https://owldrop.app"
license: "MIT"
release: "1"

contents:
  - src: "./bin/owldrop"
    dst: "/usr/local/bin/owldrop"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/owldrop.png"
  - src: "./build/linux/owldrop.desktop"
    dst: "/usr/share/applications/owldrop.desktop"

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
